---
name: Build Debian package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb on Ubuntu 26.04
    runs-on: ubuntu-26.04

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            dpkg-dev \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libssl-dev \
            librsvg2-bin

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Verify tag and crate version agree
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          crate_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$crate_version"
          test "$crate_version" = "${TAG_NAME#v}"

      - name: Compile
        run: cargo build --release --locked

      - name: Build Debian package
        id: package
        run: |
          set -eu
          packaging/build-deb.sh
          PACKAGE_FILE="$(ls -1 result/*.deb)"
          test -f "$PACKAGE_FILE"
          dpkg-deb --info "$PACKAGE_FILE"
          dpkg-deb --contents "$PACKAGE_FILE" > package-contents.txt

          # A package that builds but is missing its payload is the failure mode
          # worth catching here, while it is still this job's problem.
          grep -q 'usr/bin/mihomo-manifold' package-contents.txt
          grep -q 'usr/lib/mihomo-manifold/mihomo-manifold' package-contents.txt
          grep -q 'usr/lib/mihomo-manifold/mihomo' package-contents.txt
          grep -q 'usr/share/applications/io.github.cublae.MihomoManifold.desktop' package-contents.txt
          grep -q 'usr/share/icons/hicolor/scalable/apps/io.github.cublae.MihomoManifold.svg' package-contents.txt
          test "$(grep -c 'hicolor/[0-9]*x[0-9]*/apps/io.github.cublae.MihomoManifold.png' package-contents.txt)" -eq 8

          (cd result && sha256sum ./*.deb) > result/SHA256SUMS
          cat result/SHA256SUMS

          echo "file=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$PACKAGE_FILE")" >> "$GITHUB_OUTPUT"

      - name: Lint the package
        run: |
          set -eu
          sudo apt-get install --yes --no-install-recommends lintian
          # Reported, not enforced: a first release should not be blocked by
          # cosmetic tags, and lintian's own version skews the results anyway.
          lintian --pedantic --no-tag-display-limit "${{ steps.package.outputs.file }}" || true

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish package to the matching GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
        run: |
          set -eu
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --title "MihomoManifold $TAG_NAME" --generate-notes || true
          fi
          gh release upload "$TAG_NAME" "$PACKAGE_FILE" result/SHA256SUMS --clobber
