<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    Placeholder icon for MihomoManifold. Replace freely — nothing in the build
    depends on the artwork, only on the file name matching the application ID.

    The motif is one hub splitting into three routes. Three equal hollow circles
    joined by three equal-length lines (the angle between the two lower lines is
    100deg for visual balance).

    Background: green two-tone split circle (light #33d17a over dark gradient).

    No shadows: the motif sits flat on the two-tone background, with only the
    #2ec27e outline around the whole motif.

    Selector motif: a thin translucent arc runs through the three node centers
    (they lie on a r=33 circle around the hub), open at the bottom — the three
    routes read as positions on a dial. The top node carries a filled dot,
    like a radio button, marking the one "live" route (the active profile).

    NOTE: keep this comment *after* the <svg> start tag. gdk-pixbuf sniffs the
    first 256 bytes to decide whether a file is an SVG at all, so a long header
    comment pushes "<svg" out of the window and the icon is silently dropped.
  -->
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26a269"/>
      <stop offset="1" stop-color="#1a7d4f"/>
    </linearGradient>
  </defs>

  <!-- Background: green two-tone split circle. -->
  <g>
    <circle cx="64" cy="66" r="60" fill="url(#dg)"/>
    <rect x="4" y="62" width="120" height="4" fill="#1a7d4f"/>
    <circle cx="64" cy="62" r="60" fill="#33d17a"/>
  </g>

  <!-- Selector track: thin translucent arc through the three node centers,
       open at the bottom; drawn beneath the motif so the nodes interrupt it. -->
  <path d="M38.72 83.21 A33 33 0 1 1 89.28 83.21" fill="none" stroke="#f6f5f4" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

  <!-- Outer outline of the whole motif (three routes + three nodes treated as
       one silhouette): same geometry, stroke widened from 7 to 12 so the
       outline extends 2.5px beyond the visible shapes; drawn beneath them. -->
  <g fill="none" stroke="#2ec27e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 62 L64 29"/>
    <path d="M64 62 L89.28 83.21"/>
    <path d="M64 62 L38.72 83.21"/>
    <circle cx="64" cy="29" r="10"/>
    <circle cx="89.28" cy="83.21" r="10"/>
    <circle cx="38.72" cy="83.21" r="10"/>
  </g>

  <!-- The three routes (visible). Equal length, meet at the upper-circle
       center (64,62), each end points at a circle center. -->
  <g fill="none" stroke="#f6f5f4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M64 62 L64 29"/>
    <path d="M64 62 L89.28 83.21"/>
    <path d="M64 62 L38.72 83.21"/>
  </g>

  <!-- The three equal hollow nodes (100deg fan at the base). Rings are filled
       with the bg green so the lines behind them do not show through. -->
  <circle cx="64" cy="29" r="10" fill="#33d17a" stroke="#f6f5f4" stroke-width="7"/>
  <circle cx="89.28" cy="83.21" r="10" fill="#33d17a" stroke="#f6f5f4" stroke-width="7"/>
  <circle cx="38.72" cy="83.21" r="10" fill="#33d17a" stroke="#f6f5f4" stroke-width="7"/>

  <!-- The "live" node: filled dot inside the top ring, radio-button style. -->
  <circle cx="64" cy="29" r="4.5" fill="#f6f5f4"/>
</svg>
